{% set name = "JAGS" %}
{% set version = "5.0.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://sourceforge.net/projects/mcmc-jags/files/{{ name }}/{{ version[0] }}.x/Source/{{ name }}-{{ version }}.tar.gz/
  sha256: 64fcd4883b8a8ee907722f49366cc9f277477a0647ada61356f17568f84ffff8

build:
  number: 0
  ## begin debug
  skip: true  # [not win]
  ## end debug

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}              # [not win]
    - {{ stdlib('c') }}                # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib('m2w64_c') }}          # [win]
    - {{ compiler('cxx') }}            # [not win]
    - {{ compiler('m2w64_cxx') }}      # [win]
    - {{ compiler('fortran') }}        # [not win]
    - {{ compiler('m2w64_fortran') }}  # [win]
    - {{ posix }}filesystem            # [win]
    - {{ posix }}sed                   # [win]
    - {{ posix }}grep                  # [win]
    - pkg-config
    - {{ posix }}make
    - {{ posix }}coreutils             # [win]
    - {{ posix }}zip                   # [win]
  host:
    - libblas
    - liblapack
    - libgomp      # [not osx]
    - llvm-openmp  # [osx]

test:
  commands:
    - jags <<< 'exit'

about:
  home: https://mcmc-jags.sourceforge.net
  license: GPL-2.0-only
  license_family: GPL
  license_file: COPYING
  description: |
    JAGS is Just Another Gibbs Sampler. It is a program for analysis of Bayesian
    hierarchical models using Markov Chain Monte Carlo (MCMC) simulation
    not wholly unlike BUGS.
  summary: JAGS is Just Another Gibbs Sampler

extra:
  recipe-maintainers:
    - mfansler
    - micknudsen
