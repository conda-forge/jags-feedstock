{% set name = "JAGS" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://sourceforge.net/projects/mcmc-jags/files/{{ name }}/{{ version[0] }}.x/Source/{{ name }}-{{ version }}.tar.gz/
  sha256: 64fcd4883b8a8ee907722f49366cc9f277477a0647ada61356f17568f84ffff8

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
  host:
    - libblas
    - liblapack
    - libgomp      # [not osx]
    - llvm-openmp  # [osx]

test:
  commands:
    - jags <<< 'exit'

about:
  home: https://mcmc-jags.sourceforge.net
  license: GPL-2.0-only
  license_family: GPL
  license_file: COPYING
  description: |
    JAGS is Just Another Gibbs Sampler. It is a program for analysis of Bayesian
    hierarchical models using Markov Chain Monte Carlo (MCMC) simulation
    not wholly unlike BUGS.
  summary: JAGS is Just Another Gibbs Sampler

extra:
  recipe-maintainers:
    - mfansler
    - micknudsen
